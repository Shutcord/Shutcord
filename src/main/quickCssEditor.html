<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shutcord QuickCSS</title>
<style>
:root { color-scheme: dark; --bg:#121214; --bar:#18181b; --line:#26262b; --dim:#71717a; --txt:#e4e4e7; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--txt); font: 13px system-ui, "Segoe UI", sans-serif; overflow: hidden; }
body { display: flex; flex-direction: column; }
header { display: flex; align-items: center; gap: 12px; padding: 0 14px; height: 38px; background: var(--bar); border-bottom: 1px solid var(--line); flex: none; }
header b { font-weight: 650; letter-spacing: .2px; }
header span { color: var(--dim); }
header .sp { flex: 1; }
header button { font: inherit; color: var(--txt); background: #232328; border: 1px solid var(--line); border-radius: 7px; padding: 4px 10px; cursor: pointer; }
header button:hover { background: #2b2b31; }
#wrap { position: relative; flex: 1; display: flex; min-height: 0; }
#gutter { flex: none; width: 52px; padding: 12px 10px 12px 0; text-align: right; color: #4a4a52; background: var(--bg); border-right: 1px solid var(--line); overflow: hidden; user-select: none; white-space: pre; }
#stack { position: relative; flex: 1; min-width: 0; }
#hl, #ed { position: absolute; inset: 0; margin: 0; padding: 12px 16px; border: 0; white-space: pre; overflow: auto; tab-size: 4; -moz-tab-size: 4; }
#hl, #ed, #gutter { font: 13px/20px "Cascadia Code", "JetBrains Mono", Consolas, "Courier New", monospace; }
#hl { pointer-events: none; color: #a1a1aa; overflow: hidden; }
#ed { background: transparent; color: transparent; caret-color: #fafafa; resize: none; outline: none; }
#ed::selection { background: rgba(212, 212, 216, .22); color: transparent; }
#ed::-webkit-scrollbar { width: 12px; height: 12px; }
#ed::-webkit-scrollbar-thumb { background: #2f2f35; border-radius: 8px; border: 3px solid transparent; background-clip: padding-box; }
#ed::-webkit-scrollbar-corner { background: transparent; }
footer { display: flex; gap: 16px; align-items: center; padding: 0 14px; height: 26px; background: var(--bar); border-top: 1px solid var(--line); color: var(--dim); font-size: 12px; flex: none; }
footer .sp { flex: 1; }
.c { color: #5b5b64; font-style: italic; }
.s { color: #d4d4d8; }
.a { color: #fafafa; font-weight: 600; }
.p { color: #e4e4e7; }
.n { color: #fafafa; }
.k { color: #a1a1aa; }
.x { color: #8d8d96; }
.sel { color: #f4f4f5; }
.i { color: #fafafa; font-style: italic; }
</style>
</head>
<body>
<header><b>Shutcord</b><span>QuickCSS</span><span class="sp"></span><button id="fmt" title="Tidy indentation">Tidy</button></header>
<div id="wrap"><div id="gutter">1</div><div id="stack"><pre id="hl"></pre><textarea id="ed" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea></div></div>
<footer><span id="pos">Ln 1, Col 1</span><span id="cnt">0 chars</span><span class="sp"></span><span id="st">Loading</span></footer>
<script>
(function () {
    var ed = document.getElementById("ed"), hl = document.getElementById("hl"), gut = document.getElementById("gutter");
    var pos = document.getElementById("pos"), cnt = document.getElementById("cnt"), st = document.getElementById("st");
    var timer = 0, ready = false;

    function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
    function span(cls, s) { return '<span class="' + cls + '">' + esc(s) + "</span>"; }

    var RE = /(\/\*[\s\S]*?(?:\*\/|$))|("(?:[^"\\\n]|\\.)*"?|'(?:[^'\\\n]|\\.)*'?)|(@[\w-]+)|(#[0-9a-fA-F]{3,8}\b)|(-?\d*\.?\d+(?:px|em|rem|%|vh|vw|s|ms|deg|fr)?\b)|(--[\w-]+|[\w-]+(?=\s*:))|(!important)|([{}])/g;

    function highlight(src) {
        var out = "", last = 0, depth = 0, m;
        RE.lastIndex = 0;
        function plain(t) { out += esc(t); }
        while ((m = RE.exec(src))) {
            var before = src.slice(last, m.index);
            if (depth === 0 && before.trim()) out += span("sel", before); else plain(before);
            last = RE.lastIndex;
            var t = m[0];
            if (m[1]) out += span("c", t);
            else if (m[2]) out += span("s", t);
            else if (m[3]) out += span("a", t);
            else if (m[4] || m[5]) out += depth ? span("n", t) : span("sel", t);
            else if (m[6]) out += depth ? span(t.slice(0, 2) === "--" ? "x" : "p", t) : span("sel", t);
            else if (m[7]) out += span("i", t);
            else if (m[8]) { depth += t === "{" ? 1 : -1; if (depth < 0) depth = 0; out += span("k", t); }
        }
        var tail = src.slice(last);
        if (depth === 0 && tail.trim()) out += span("sel", tail); else plain(tail);
        return out + "\n";
    }

    function render() {
        var v = ed.value;
        hl.innerHTML = highlight(v);
        var lines = v.split("\n").length, g = "";
        for (var i = 1; i <= lines; i++) g += i + "\n";
        gut.textContent = g;
        sync(); status();
    }
    function sync() { hl.scrollTop = ed.scrollTop; hl.scrollLeft = ed.scrollLeft; gut.scrollTop = ed.scrollTop; }
    function status() {
        var before = ed.value.slice(0, ed.selectionStart).split("\n");
        pos.textContent = "Ln " + before.length + ", Col " + (before[before.length - 1].length + 1);
        cnt.textContent = ed.value.length + " chars";
    }
    function save() {
        clearTimeout(timer);
        st.textContent = "Saving";
        Promise.resolve(window.setCss(ed.value)).then(function () { st.textContent = "Saved"; }, function () { st.textContent = "Could not save"; });
    }
    function queue() { if (!ready) return; st.textContent = "Unsaved"; clearTimeout(timer); timer = setTimeout(save, 400); }

    function lineBounds() {
        var v = ed.value, s = v.lastIndexOf("\n", ed.selectionStart - 1) + 1, e = v.indexOf("\n", ed.selectionEnd);
        return [s, e === -1 ? v.length : e];
    }
    function replace(from, to, text, selStart, selEnd) {
        ed.focus();
        ed.setSelectionRange(from, to);
        if (!document.execCommand("insertText", false, text)) { ed.setRangeText(text, from, to, "end"); ed.dispatchEvent(new Event("input")); }
        ed.setSelectionRange(selStart, selEnd);
    }
    function indent(out) {
        var b = lineBounds(), block = ed.value.slice(b[0], b[1]);
        var lines = block.split("\n").map(function (l) { return out ? l.replace(/^( {1,4}|\t)/, "") : "    " + l; });
        var text = lines.join("\n");
        replace(b[0], b[1], text, b[0], b[0] + text.length);
    }
    function toggleComment() {
        var b = lineBounds(), lines = ed.value.slice(b[0], b[1]).split("\n");
        var all = lines.every(function (l) { return !l.trim() || /^\s*\/\*.*\*\/\s*$/.test(l); });
        var text = lines.map(function (l) {
            if (!l.trim()) return l;
            return all ? l.replace(/\/\*\s?/, "").replace(/\s?\*\/\s*$/, "") : l.replace(/^(\s*)(.*)$/, "$1/* $2 */");
        }).join("\n");
        replace(b[0], b[1], text, b[0], b[0] + text.length);
    }
    function tidy() {
        var depth = 0, out = ed.value.split("\n").map(function (raw) {
            var l = raw.trim();
            if (/^}/.test(l)) depth = Math.max(0, depth - 1);
            var r = l ? "    ".repeat(depth) + l : "";
            var opens = (l.replace(/\/\*.*?\*\//g, "").match(/{/g) || []).length, closes = (l.replace(/\/\*.*?\*\//g, "").match(/}/g) || []).length;
            depth = Math.max(0, depth + opens - (/^}/.test(l) ? closes - 1 : closes));
            return r;
        }).join("\n");
        replace(0, ed.value.length, out, 0, 0);
    }

    ed.addEventListener("input", function () { render(); queue(); });
    ed.addEventListener("scroll", sync);
    ed.addEventListener("keyup", status);
    ed.addEventListener("click", status);
    ed.addEventListener("keydown", function (e) {
        var mod = e.ctrlKey || e.metaKey;
        if (mod && e.key.toLowerCase() === "s") { e.preventDefault(); save(); }
        else if (mod && e.key === "/") { e.preventDefault(); toggleComment(); }
        else if (e.key === "Tab") {
            e.preventDefault();
            if (e.shiftKey || ed.selectionStart !== ed.selectionEnd) indent(e.shiftKey);
            else replace(ed.selectionStart, ed.selectionEnd, "    ", ed.selectionStart + 4, ed.selectionStart + 4);
        } else if (e.key === "Enter" && !mod) {
            e.preventDefault();
            var s = ed.selectionStart, v = ed.value, ls = v.lastIndexOf("\n", s - 1) + 1;
            var cur = v.slice(ls, s), ind = cur.match(/^\s*/)[0];
            var extra = /{\s*$/.test(cur) ? "    " : "";
            var closes = v.charAt(ed.selectionEnd) === "}" && extra;
            var text = "\n" + ind + extra + (closes ? "\n" + ind : "");
            replace(s, ed.selectionEnd, text, s + 1 + ind.length + extra.length, s + 1 + ind.length + extra.length);
        }
    });
    document.getElementById("fmt").onclick = function () { tidy(); };

    Promise.resolve(window.getCurrentCss()).then(function (css) {
        ed.value = css || "";
        render();
        ready = true;
        st.textContent = "Saved";
        ed.focus();
    }, function () { st.textContent = "Could not load"; });
})();
</script>
</body>
</html>
