<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shutcord QuickCSS</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #121214; color: #e4e4e7; overflow: hidden; font: 13px system-ui, "Segoe UI", sans-serif; }
#container { position: fixed; inset: 0; }
#fallback { position: fixed; inset: 0; width: 100%; height: 100%; margin: 0; padding: 14px 18px; border: 0; outline: none; resize: none; background: #121214; color: #e4e4e7; font: 13px/20px Consolas, "Courier New", monospace; tab-size: 4; display: none; }
</style>
</head>
<body>
<div id="container"></div>
<textarea id="fallback" spellcheck="false"></textarea>
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
<script>
(function () {
    var BASE = "https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min";
    var saveTimer = 0, ready = false;

    function save(value) { return Promise.resolve(window.setCss(value)); }
    function queueSave(get) {
        if (!ready) return;
        clearTimeout(saveTimer);
        saveTimer = setTimeout(function () { save(get()); }, 300);
    }

    function startFallback(css) {
        var ta = document.getElementById("fallback");
        document.getElementById("container").style.display = "none";
        ta.style.display = "block";
        ta.value = css;
        ready = true;
        ta.addEventListener("input", function () { queueSave(function () { return ta.value; }); });
        ta.focus();
    }

    Promise.resolve(window.getCurrentCss()).then(function (css) {
        css = css || "";
        if (typeof require === "undefined" || !require.config) return startFallback(css);

        var failTimer = setTimeout(function () { if (!ready) startFallback(css); }, 8000);

        self.MonacoEnvironment = {
            getWorkerUrl: function () {
                return "data:text/javascript;charset=utf-8," + encodeURIComponent(
                    "self.MonacoEnvironment = { baseUrl: '" + BASE + "' };\nimportScripts('" + BASE + "/vs/base/worker/workerMain.js');"
                );
            }
        };
        require.config({ paths: { vs: BASE + "/vs" } });
        require(["vs/editor/editor.main"], function () {
            clearTimeout(failTimer);
            monaco.editor.defineTheme("shutcord", {
                base: "vs-dark",
                inherit: true,
                rules: [],
                colors: {
                    "editor.background": "#121214",
                    "editor.lineHighlightBackground": "#18181b",
                    "editorLineNumber.foreground": "#4a4a52",
                    "editorLineNumber.activeForeground": "#a1a1aa",
                    "editorGutter.background": "#121214",
                    "editor.selectionBackground": "#3f3f46aa",
                    "editorCursor.foreground": "#fafafa",
                    "scrollbarSlider.background": "#2f2f3580"
                }
            });
            var editor = monaco.editor.create(document.getElementById("container"), {
                value: css,
                language: "css",
                theme: "shutcord",
                automaticLayout: true,
                minimap: { enabled: false },
                fontSize: 13,
                fontFamily: "'Cascadia Code', 'JetBrains Mono', Consolas, monospace",
                scrollBeyondLastLine: false,
                smoothScrolling: true,
                renderLineHighlight: "line",
                padding: { top: 12, bottom: 12 },
                overviewRulerLanes: 0,
                hideCursorInOverviewRuler: true
            });
            ready = true;
            editor.onDidChangeModelContent(function () { queueSave(function () { return editor.getValue(); }); });
            editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, function () { save(editor.getValue()); });
            editor.focus();
        }, function () { clearTimeout(failTimer); if (!ready) startFallback(css); });
    });
})();
</script>
</body>
</html>
