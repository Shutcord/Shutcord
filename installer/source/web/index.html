<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shutcord Installer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%20512%20512%22%20width=%22512%22%20height=%22512%22%3E%3Crect%20width=%22512%22%20height=%22512%22%20rx=%2296%22%20fill=%22%2318181b%22/%3E%3Cpath%20fill=%22%23d4d4d8%22%20d=%22M87%20165h130v26h-130zM295%20165h130v26h-130zM61%20191h52v26h-52zM191%20191h52v26h-52zM269%20191h52v26h-52zM399%20191h52v26h-52zM61%20217h52v26h-52zM269%20217h52v26h-52zM87%20243h130v26h-130zM269%20243h52v26h-52zM191%20269h52v26h-52zM269%20269h52v26h-52zM61%20295h52v26h-52zM191%20295h52v26h-52zM269%20295h52v26h-52zM399%20295h52v26h-52zM87%20321h130v26h-130zM295%20321h130v26h-130z%22/%3E%3C/svg%3E">
<style>
:root {
    --bg: #0f0f10;
    --panel: #151518;
    --line: #26262a;
    --line-hi: #3a3a41;
    --text: #e4e4e8;
    --muted: #84848e;
    --dim: #5a5a63;
    --btn: #e4e4e8;
    --btn-text: #0f0f10;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; overflow: hidden; background: var(--bg); }
body {
    color: var(--text);
    font: 14px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    display: flex; flex-direction: column;
    padding: 26px 30px 20px;
}

header { display: flex; align-items: center; gap: 14px; }
.mark { width: 66px; height: 31px; flex: none; }
.title b { display: block; font-size: 20px; font-weight: 650; letter-spacing: -.01em; }
.title span { color: var(--muted); font-size: 12.5px; }
.ver { margin-left: auto; color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }

.rule { height: 1px; background: var(--line); margin: 20px 0 18px; }

.view { display: none; flex: 1; min-height: 0; flex-direction: column; }
.view.show { display: flex; animation: fade .18s ease-out; }
@keyframes fade { from { opacity: 0; } }

.label { color: var(--muted); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 10px; }
.note { border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; margin-bottom: 10px; color: var(--muted); font-size: 12.5px; display: none; }
.note.show { display: block; }

.list { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; min-height: 0; }
.list::-webkit-scrollbar { width: 8px; } .list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }
.row { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); transition: border-color .12s; }
.row:hover { border-color: var(--line-hi); }
.badge { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line-hi); display: grid; place-items: center; font-weight: 700; font-size: 14px; color: var(--muted); flex: none; }
.info { min-width: 0; flex: 1; }
.info b { font-weight: 600; font-size: 14.5px; }
.state { color: var(--muted); font-size: 12px; margin-left: 8px; }
.state::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; border: 1px solid var(--muted); margin-right: 6px; vertical-align: 1px; }
.state.on { color: var(--text); } .state.on::before { background: var(--text); border-color: var(--text); }
.path { color: var(--dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; user-select: text; }
.acts { display: flex; gap: 8px; flex: none; }

button { font: inherit; font-weight: 600; font-size: 13px; cursor: pointer; border-radius: 8px; padding: 7px 15px; border: 1px solid var(--line-hi); background: transparent; color: var(--text); transition: background .12s, border-color .12s, opacity .12s; }
button:hover:not(:disabled) { background: rgba(255,255,255,.06); border-color: #52525a; }
button:disabled { opacity: .3; cursor: not-allowed; }
button:focus-visible { outline: 2px solid var(--muted); outline-offset: 2px; }
button.solid { background: var(--btn); color: var(--btn-text); border-color: var(--btn); }
button.solid:hover:not(:disabled) { background: #fff; border-color: #fff; }

.empty { padding: 26px; text-align: center; color: var(--muted); border: 1px dashed var(--line-hi); border-radius: 10px; }

.custom { margin-top: 12px; }
.custom .link { border: 0; padding: 4px 0; color: var(--muted); font-weight: 500; }
.custom .link:hover { background: none; color: var(--text); }
.custom .in { display: none; gap: 8px; margin-top: 6px; }
.custom.open .in { display: flex; }
.custom input { flex: 1; background: var(--panel); border: 1px solid var(--line-hi); color: var(--text); border-radius: 8px; padding: 8px 12px; font: inherit; user-select: text; }
.custom input:focus { outline: none; border-color: var(--muted); }

footer { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 14px; color: var(--dim); font-size: 12px; }
footer .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
footer b { color: var(--muted); font-weight: 500; user-select: text; }
footer a { color: var(--muted); text-decoration: none; cursor: pointer; }
footer a:hover { color: var(--text); text-decoration: underline; }

/* progress + result */
.center { margin: auto; width: 100%; max-width: 420px; }
.center h2 { font-size: 19px; font-weight: 650; letter-spacing: -.01em; }
.center p { color: var(--muted); margin-top: 4px; }
.steps { list-style: none; padding: 0; margin: 22px 0 0; }
.steps li { display: flex; align-items: center; gap: 12px; padding: 8px 0; color: var(--dim); }
.steps li.active, .steps li.done { color: var(--text); }
.steps li.error { color: var(--text); }
.dot { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--line-hi); flex: none; display: grid; place-items: center; }
.steps li.active .dot { border-color: var(--line-hi); border-top-color: var(--text); animation: spin .8s linear infinite; }
.steps li.done .dot { background: var(--text); border-color: var(--text); }
.steps li.error .dot { border-color: var(--text); }
.dot svg { width: 10px; height: 10px; display: none; fill: none; stroke: var(--bg); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.steps li.done .dot .ck { display: block; }
.steps li.error .dot .x { display: block; stroke: var(--text); }
@keyframes spin { to { transform: rotate(360deg); } }
.bar { height: 3px; background: var(--line); border-radius: 3px; margin-top: 18px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--text); transition: width .35s ease; }
.err { margin-top: 14px; padding: 10px 12px; border: 1px solid var(--line-hi); border-radius: 8px; color: var(--text); font-size: 12.5px; user-select: text; word-break: break-word; }
.btns { display: flex; gap: 8px; margin-top: 22px; }
.tick { width: 46px; height: 46px; border-radius: 50%; border: 1.5px solid var(--text); display: grid; place-items: center; margin-bottom: 16px; }
.tick svg { width: 22px; height: 22px; fill: none; stroke: var(--text); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.closed { position: fixed; inset: 0; background: var(--bg); display: none; place-items: center; color: var(--muted); }
.closed.show { display: grid; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 224" class="mark" shape-rendering="crispEdges"><path fill="#d4d4d8" d="M32 0h160v32h-160zM288 0h160v32h-160zM0 32h64v32h-64zM160 32h64v32h-64zM256 32h64v32h-64zM416 32h64v32h-64zM0 64h64v32h-64zM256 64h64v32h-64zM32 96h160v32h-160zM256 96h64v32h-64zM160 128h64v32h-64zM256 128h64v32h-64zM0 160h64v32h-64zM160 160h64v32h-64zM256 160h64v32h-64zM416 160h64v32h-64zM32 192h160v32h-160zM288 192h160v32h-160z"/></svg>
    <div class="title"><b>Shutcord</b><span>Installer</span></div>
    <div class="ver" id="ver"></div>
</header>
<div class="rule"></div>

<section class="view show" id="vPick">
    <div class="label">Choose a Discord to patch</div>
    <div class="note" id="note"></div>
    <div class="list" id="list"></div>
    <div class="custom" id="custom">
        <button class="link" id="customToggle">+ Custom folder</button>
        <div class="in"><input id="customPath" placeholder="C:\Users\you\AppData\Local\Discord" spellcheck="false"><button class="solid" id="customAdd">Add</button></div>
    </div>
</section>

<section class="view" id="vWork">
    <div class="center">
        <h2 id="wTitle">Installing</h2>
        <p>Discord will close.</p>
        <ul class="steps" id="wSteps"></ul>
        <div class="bar"><i id="wBar"></i></div>
    </div>
</section>

<section class="view" id="vDone">
    <div class="center">
        <div class="tick" id="dTick"><svg viewBox="0 0 24 24" id="dIcon"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
        <h2 id="dTitle"></h2>
        <p id="dSub"></p>
        <div class="err" id="dErr" style="display:none"></div>
        <div class="btns">
            <button class="solid" id="dLaunch">Launch Discord</button>
            <button id="dBack">Back</button>
            <button id="dQuit">Close</button>
        </div>
    </div>
</section>

<footer>
    <span class="grow">Build <b id="fBuild">...</b> &middot; <span id="fStatus"></span></span>
    <a data-href="https://github.com/Shutcord/Shutcord">GitHub</a>
</footer>
<div class="closed" id="closed">You can close this window.</div>

<script>
const token = new URLSearchParams(location.search).get("t") || "";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let state = null, busy = false, lastTarget = null;

async function api(path, body) {
    const r = await fetch("/api/" + path, { method: body ? "POST" : "GET", headers: { "X-Token": token, "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
    if (!r.ok) throw new Error("Lost connection to the installer");
    return r.json();
}
const show = id => { for (const v of ["vPick", "vWork", "vDone"]) $(v).classList.toggle("show", v === id); };
const niceName = b => b === "stable" ? "Discord" : b === "ptb" ? "Discord PTB" : "Discord " + (b || "").replace(/^./, c => c.toUpperCase());

function row(i) {
    let st = '<span class="state">Not installed</span>';
    if (i.shutcord) st = '<span class="state on">Shutcord installed</span>';
    else if (i.other) st = `<span class="state">${esc(i.other)} installed</span>`;
    const label = i.shutcord ? (state && state.update ? "Update" : "Reinstall") : (i.other ? "Replace " + esc(i.other) : "Install");
    return `<div class="row" data-id="${esc(i.id)}">
        <div class="badge">${esc((i.branch || "?")[0].toUpperCase())}</div>
        <div class="info"><b>${esc(niceName(i.branch))}</b>${st}<div class="path" title="${esc(i.path)}">${esc(i.path)}</div></div>
        <div class="acts"><button class="solid" data-act="install">${label}</button><button data-act="uninstall" ${i.shutcord ? "" : "disabled"}>Uninstall</button></div>
    </div>`;
}

async function refresh() {
    const s = await api("state"); state = s;
    $("ver").textContent = "v" + (s.version && s.version !== "Unknown" ? s.version : "dev");
    $("fBuild").textContent = s.dev ? "local" : (s.latest && s.latest !== "Unknown" ? s.latest : "none");
    $("fStatus").textContent = s.dev ? "developer mode" : s.latestErr === "checking" ? "checking..." : !s.latestOk ? "no release found" : s.update ? "update available" : "up to date";

    const note = $("note"); let msg = "";
    if (!s.latestOk && s.latestErr && s.latestErr !== "checking") msg = "Couldn't find a Shutcord release (" + s.latestErr + "). The repo must be public and have a published release.";
    const others = [...new Set(s.installs.filter(i => i.other).map(i => i.other))];
    if (others.length) msg += (msg ? " " : "") + others.join(", ") + " is installed on one of these. Installing replaces it.";
    note.textContent = msg; note.classList.toggle("show", !!msg);

    $("list").innerHTML = s.installs.length ? s.installs.map(row).join("") : '<div class="empty">No Discord found. Install Discord first or add its folder.</div>';
}

const CK = '<svg class="ck" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><svg class="x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';
function renderSteps(steps) {
    $("wSteps").innerHTML = steps.map(s => `<li class="${s.state}"><span class="dot">${CK}</span>${esc(s.label)}</li>`).join("");
    $("wBar").style.width = Math.max(6, steps.filter(s => s.state === "done").length / steps.length * 100) + "%";
}

async function run(kind, id) {
    busy = true; lastTarget = id;
    $("wTitle").textContent = kind === "install" ? "Installing Shutcord" : "Removing Shutcord";
    $("wSteps").innerHTML = ""; $("wBar").style.width = "6%"; show("vWork");
    let j;
    try { j = await api(kind, { id }); } catch (e) { return finish(kind, { success: false, error: e.message }); }
    if (!j.ok) return finish(kind, { success: false, error: j.message });
    for (;;) {
        await new Promise(r => setTimeout(r, 260));
        let s; try { s = await api("job?id=" + j.job); } catch (e) { return finish(kind, { success: false, error: e.message }); }
        if (!s.ok) return finish(kind, { success: false, error: s.message });
        renderSteps(s.steps);
        if (s.done) { await new Promise(r => setTimeout(r, 450)); return finish(kind, s); }
    }
}

function finish(kind, s) {
    busy = false;
    const ok = !!s.success, inst = kind === "install";
    $("dIcon").innerHTML = ok ? '<path d="M5 12.5l4.5 4.5L19 7.5"/>' : '<path d="M6 6l12 12M18 6L6 18"/>';
    $("dTitle").textContent = ok ? (inst ? "Shutcord is installed" : "Shutcord removed") : (inst ? "Install failed" : "Couldn't remove it");
    $("dSub").textContent = ok ? (inst ? "Start Discord and open User Settings. Shutcord is at the top of the sidebar." : "Discord is back to normal.") : "Your Discord was left as it was.";
    const err = $("dErr"); err.style.display = ok ? "none" : "block"; err.textContent = s.error || "";
    $("dLaunch").style.display = ok && state && state.os === "windows" ? "" : "none";
    show("vDone"); refresh().catch(() => {});
}

$("list").addEventListener("click", e => { const b = e.target.closest("button[data-act]"); if (b && !busy) run(b.dataset.act, b.closest(".row").dataset.id); });
$("dBack").onclick = () => { show("vPick"); refresh().catch(() => {}); };
$("dLaunch").onclick = async () => { const b = $("dLaunch"); b.disabled = true; b.textContent = "Starting..."; try { await api("launch", { id: lastTarget }); b.textContent = "Started"; } catch { b.textContent = "Couldn't start"; } setTimeout(() => { b.disabled = false; b.textContent = "Launch Discord"; }, 4000); };
$("customToggle").onclick = () => { $("custom").classList.toggle("open"); $("customPath").focus(); };
$("customAdd").onclick = async () => { const p = $("customPath").value.trim(); if (!p) return; const r = await api("custom", { path: p }); if (r.ok) { $("customPath").value = ""; $("custom").classList.remove("open"); await refresh(); } else alert(r.message); };
$("customPath").addEventListener("keydown", e => { if (e.key === "Enter") $("customAdd").click(); });
document.querySelectorAll("[data-href]").forEach(a => a.onclick = () => api("open", { url: a.dataset.href }).catch(() => {}));
async function quit() { try { await api("quit", {}); } catch {} clearInterval(pt); $("closed").classList.add("show"); window.close(); }
$("dQuit").onclick = quit;

const pt = setInterval(() => api("ping").catch(() => {}), 3000); api("ping").catch(() => {});
refresh().catch(e => { $("note").textContent = e.message; $("note").classList.add("show"); });
let n = 0; const poll = setInterval(() => { if (++n > 8 || busy) return clearInterval(poll); refresh().catch(() => {}); }, 1500);
</script>
</body>
</html>
