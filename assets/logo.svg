<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241552"/>
      <stop offset="1" stop-color="#0b0814"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#5b3de0" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="vi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4b3ff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7cf0c3"/>
      <stop offset="1" stop-color="#3ddc97"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#7c5cff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="230" fill="url(#glow)"/>
  <rect x="3" y="3" width="506" height="506" rx="113" fill="none" stroke="url(#rim)" stroke-width="6"/>
  <!-- an S built from five shutter slats -->
  <g>
    <rect x="104" y="78"  width="304" height="52" rx="26" fill="url(#vi)"/>
    <rect x="104" y="154" width="140" height="52" rx="26" fill="url(#vi)"/>
    <rect x="104" y="230" width="304" height="52" rx="26" fill="url(#mint)"/>
    <rect x="268" y="306" width="140" height="52" rx="26" fill="url(#vi)"/>
    <rect x="104" y="382" width="304" height="52" rx="26" fill="url(#vi)"/>
  </g>
</svg>
